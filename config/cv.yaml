# Rules scripts/cv-lint.ts applies to every CV variant (pipeline/<slug>/cv/bullets.yaml).
# Edited by the user. Background: docs/cv-for-role.md.

# A bullet using one of these verbs (or its forms) needs a cited source that uses the same verb,
# or `strength_ok_by: user` on the bullet after the user confirms it.
strength_words:
  - [led, lead, leading, leads]
  - [owned, own, owning, owns, owner, ownership]
  - [managed, manage, managing, manages, manager]
  - [mentored, mentor, mentoring, mentors]
  - [drove, drive, driving, drives]
  - [spearheaded, spearhead]
  - [headed, head]
  - [architected, architect]

# Qualifiers that must survive: if a cited win's action uses one, a bullet citing that win must too.
# Qualifiers inside a metric ("up to", "an estimated") are covered by quoting the metric clause whole.
qualifiers: ["contributed to"]

# Seniority words a headline may use only when a history.yaml public title contains them.
seniority_words: [Staff, Principal, Lead, Head, Director, Manager, VP]

# Words that do not belong on a CV, which has no narrator. A pronoun in the first list, or a
# bracketed part holding one of them or a word from the third list, refuses the CV. The second
# list only warns, since a script cannot tell whom "they" means. "I" counts only as a capital on
# its own. Every other word is matched whole, in any case, with two exceptions that are read as
# part of a name and left alone: a pronoun in two or more capitals ("ME" in "Portland, ME"), and
# one in Title Case that neither starts the text nor follows a sentence end ("Her Campus"). Right
# after an opening bracket, a Title Case pronoun is a name only when a capitalised word follows
# it, so "(Her Campus)" passes and "(My guess)" does not. Only prose is checked (headline,
# summary, bullets, training, projects, a job's note, an achievement's figure), never company,
# role, place, tech, skill, language or school names. Inside brackets a note word is matched as a
# whole word, or that word with an ending such as -s, -d, -ed, -ing, -ly ("estimated",
# "estimating", "approximately").
error_pronouns: [he, his, him, she, her, I, my, me]
warning_pronouns: [they, their, we, our]
note_words: [estimate, approx, unverified, tbc, todo, note]

# How many of the newest jobs in history.yaml count as recent and take the recent bullet range.
recent_jobs: 3

# Bullets per job: the recent jobs and older ones.
bullets_per_job: {recent: [2, 5], older: [0, 2]}
