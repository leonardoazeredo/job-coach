name: Stage follows issue state

# Board columns use the Stage issue field, which GitHub's built-in project
# workflows do not touch: they only move the per-project Status field.
on:
  issues:
    types: [opened, closed, reopened]

permissions:
  issues: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Set Stage
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          ISSUE_ID: ${{ github.event.issue.node_id }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          # Any close, completed or not planned, goes to Done; a new or reopened issue goes to Todo.
          STAGE: ${{ github.event.action == 'closed' && 'Done' || 'Todo' }}
        run: |
          if [ "$ACTION" = opened ]; then
            # An issue opened with a Stage already chosen keeps it.
            current=$(gh api graphql -f issue="$ISSUE_ID" -f query='
              query($issue: ID!) {
                node(id: $issue) { ... on Issue { issueFieldValues(first: 20) { nodes { ... on IssueFieldSingleSelectValue { field { ... on IssueFieldSingleSelect { name } } } } } } }
              }' --jq '[.data.node.issueFieldValues.nodes[] | select(.field.name == "Stage")] | length')
            [ "$current" = 0 ] || exit 0
          fi
          option=$(gh api graphql -f owner="$OWNER" -f repo="$REPO" -f query='
            query($owner: String!, $repo: String!) {
              repository(owner: $owner, name: $repo) {
                issueFields(first: 30) { nodes { ... on IssueFieldSingleSelect { id name options { id name } } } }
              }
            }' --jq ".data.repository.issueFields.nodes[] | select(.name == \"Stage\") | [.id, (.options[] | select(.name == \"$STAGE\") | .id)] | @tsv")
          field=${option%%$'\t'*}
          value=${option#*$'\t'}
          gh api graphql -f issue="$ISSUE_ID" -f field="$field" -f value="$value" -f query='
            mutation($issue: ID!, $field: ID!, $value: ID!) {
              setIssueFieldValue(input: {issueId: $issue, issueFields: [{fieldId: $field, singleSelectOptionId: $value}]}) { clientMutationId }
            }'
